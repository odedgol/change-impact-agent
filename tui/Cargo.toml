[package]
name = "cia-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for the change-impact agent: replays the investigator's JSON-lines events."
publish = false

[dependencies]
ratatui = "0.29"
# use-dev-tty: read keys from /dev/tty when the events arrive on a pipe (macOS needs it)
crossterm = { version = "0.28", features = ["use-dev-tty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
