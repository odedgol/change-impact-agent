# Slack app for the Change Impact Agent (PR 4.4). Create it at https://api.slack.com/apps
# -> Create New App -> From a manifest -> paste this file -> Install to workspace.
# Then put in .env (never commit it):
#   SLACK_BOT_TOKEN=xoxb-...   OAuth & Permissions -> Bot User OAuth Token
#   SLACK_APP_TOKEN=xapp-...   Basic Information -> App-Level Tokens, scope connections:write
#   CIA_SLACK_CHANNEL=C0...    the channel's ID; then /invite @Change Impact Agent there
#   CIA_SLACK_APPROVERS=U0...,U0...   member IDs of the people allowed to approve
# Already installed? Paste this file in App Manifest, save, then Reinstall to Workspace.
# Socket Mode: the agent opens one outbound websocket, so it needs no public URL.
display_information:
  name: Change Impact Agent
  description: Investigates a leaver's account before anything is deleted; asks before acting.
  background_color: "#2f52e0"
features:
  app_home:
    messages_tab_enabled: true  # DMs with the bot
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Change Impact Agent
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write   # post and update its own messages
      - app_mentions:read  # only messages that @mention the app, to answer questions
      - channels:history   # replies in a thread the bot answered in, without an @mention
      - im:history         # direct messages to the bot
settings:
  event_subscriptions:
    bot_events:
      - app_mention  # "@Change Impact Agent what's going on with Noah Novak?"
      - message.channels  # follow-ups in the bot's own threads (others are ignored)
      - message.im        # talk to the bot in a DM
  interactivity:
    is_enabled: true # the Approve and Decline buttons
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
