[project]
name = "change-impact-agent"
version = "0.1.0"
description = "An agent that investigates what could break before an IAM change is made."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "langgraph>=1.2.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
bedrock = ["boto3>=1.35"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # long SQL and ticket strings in week-1 code; no formatter churn in this PR

[tool.setuptools.package-data]
cia = ["monitor.html"]
