[project]
name = "change-impact-agent"
version = "0.1.0"
description = "An agent that investigates what could break before an IAM change is made."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",  # approval and quiet-period waits survive a restart
    "fastapi>=0.115,<1",  # the agent service: HR events in (cia.service)
    "uvicorn>=0.30,<1",
    "slack_bolt>=1.21,<2",  # Slack messages and buttons over Socket Mode (cia.slack)
    "mcp>=2.3,<3",  # ask the agent from Claude, read-only (cia.mcp_server)
    "cryptography>=42",  # the simulated vault encrypts its values (world.py)
    "psycopg[binary]>=3.2,<4",  # Postgres + pgvector document index (docindex.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.409", "httpx>=0.27"]  # httpx: FastAPI's TestClient
bedrock = ["boto3>=1.35"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
# Editors and `make typecheck` find the venv and the src/ layout.
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter sets line length; long strings and URLs stay whole

[tool.setuptools.package-data]
cia = ["monitor.html"]
