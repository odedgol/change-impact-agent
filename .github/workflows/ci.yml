name: CI

# Every PR into main must pass these checks before it can merge (see docs/index.html#workflow).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Editing only the PR description does not need a new test run.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: make test

  pr-description:
    # The PR body must say what changed and point to the docs page that explains it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          if ! grep -qiE '^## +What changed' <<<"$BODY"; then
            echo "::error::Add a '## What changed' section (1-3 plain bullets)."; fail=1
          fi
          if ! grep -qE 'docs/[A-Za-z0-9._-]+\.html' <<<"$BODY"; then
            echo "::error::Link the docs page for this change, e.g. docs/week-2.html."; fail=1
          fi
          if ! grep -qiE '^## +How to test' <<<"$BODY"; then
            echo "::error::Add a '## How to test' section with the commands a reviewer runs."; fail=1
          fi
          exit $fail
