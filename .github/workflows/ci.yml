name: CI

# Every PR into main must pass these checks before it can merge (see docs/index.html#workflow).
# Description edits do not trigger this workflow, so they can never cancel or skip a test run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      pgvector:  # the document index contract tests run on real pgvector too (CIA_PG_DSN)
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: cia
          POSTGRES_PASSWORD: cia
          POSTGRES_DB: cia
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cia" --health-interval 2s --health-retries 30
    env:
      CIA_PG_DSN: postgresql://cia:cia@localhost:5433/cia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test
      - name: Bench (plumbing check, rule model)
        run: make bench-fake

  tui:
    # The Rust terminal UI: format, lint, replay tests, then a live smoke run piped in (plain mode).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - name: Install
        run: python -m pip install -e .
      - name: fmt, clippy, cargo test
        run: make tui-test
      - name: Smoke (FakeLLM runs piped into the UI)
        run: make smoke SMOKE_FLAGS=--plain
